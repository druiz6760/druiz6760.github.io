<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 9 Webpage Tempalte</title>
</head>

<body>
    
    <header>

        <!-- Navigation links go here -->
        <nav>
        </nav>
        <div>
            <h1>Welcome to Lesson 9</h1>
            <p>
            In this lesson we will learn about video and audio elements.
            </p>
        </div>
    </header>

    <!-- Main webpage contnent goes here -->
    <main>
        
        <div>
            <!-- This is a video element -->
            <video controls width="500">
                <source src="media/video.mp4" type="video/mp4">
                <p>Your browser does not support video.</p>
            </video>
        </div>

        <div>
            <!-- This is an audio element -->
            <audio controls>
                <source src="media/audio.mp3" type="audio/mpeg">
                <p>Your browser does not support audio.</p>
            </audio>
        </div>
    </main>

    <footer>
        <!--Footer content goes here-->
    </footer>
    
</body>

</html>
