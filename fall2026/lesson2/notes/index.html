HTML NOTES
==========
Headings
========
-search engines use for indexing content and structure of the webpage
-<h1> -Page titles (Use only one per page. Represents the main topic.)
-<h2>-Section title
-<h3>-Sub sections
Example
    <h1>Travel Guide</h1>// title

    <h2>Europe</h2>//sub title
    <h3>France</h3>//seb sections
    <h3>Italy</h3>

CSS and headings
-headings are already bold
-use CSS to make them bigger via 'font-size'

Paragraphs
==========
-the number of lines or spacing is ignored bgnored by the browser. 
-you cannot effect the display of content by adding extra spaces or lines. 
-always start on a new line

<hr>: creates a horziontal line on the screen
<br>: defines a line break. text that appears after it will start on a new line

-pre tag keeps both the spaces and line breaks
-Example
    <pre>
    My Bonnie lies over the ocean.

    My Bonnie lies over the sea.

    My Bonnie lies over the ocean.
    
    Oh, bring back my Bonnie to me.
    </pre>

HTML Styles
===========
-an attribute
-adds style to an element
-syntax: style="property:value"
-placed in the start tag of the targeted HTML element

HTML Text Formatting (these are NOT CSS styles)
===================================================
-elements for defining text with a speacial meaning
Tag	Description
<b>	Defines bold text
<em>	Defines emphasized text 
<i>	Defines a part of text in an alternate voice or mood
<small>	Defines smaller text
<strong>	Defines important text
<sub>	Defines subscripted text
<sup>	Defines superscripted text
<ins>	Defines inserted text
<del>	Defines deleted text
<mark>	Defines marked/highlighted text

Quotation and Citation Elements
===============================
<abbr>	Defines an abbreviation or acronym </abbr>
<address>	Defines contact information for the author/owner of a document
<bdo>	Defines the text direction
<blockquote> Defines a section that is quoted from another source </blockquote>
<cite>	Defines the title of a work 
<q>	Defines a short inline quotation
